x-app: &app
  build:
    context: .
    target: app
  image: laravel-app
  env_file: .env
  restart: unless-stopped
  volumes:
    - storage_data:/var/www/html/storage

x-app-env: &app-env
  DB_CONNECTION: mysql
  DB_HOST: db
  DB_PORT: "3306"

services:
  # ---------- PHP-FPM (runs Laravel, migrations on start) ----------
  app:
    <<: *app
    environment:
      <<: *app-env
      RUN_MIGRATIONS: "true"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # php-fpm only starts after migrations finish, so "healthy" means "ready"
      test: ["CMD-SHELL", "pgrep php-fpm || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 60

  # ---------- Caddy web server ----------
  web:
    build:
      context: .
      target: web
    image: laravel-web
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - caddy_data:/data        # certificates: keep persistent
      - caddy_config:/config
      - storage_data:/var/www/html/storage:ro
    depends_on:
      app:
        condition: service_healthy

  # ---------- Queue worker ----------
  queue:
    <<: *app
    command: php artisan queue:work --tries=3 --sleep=3
    environment:
      <<: *app-env
      RUN_MIGRATIONS: "false"
    depends_on:
      app:
        condition: service_healthy

  # ---------- Scheduler (runs schedule:run every minute) ----------
  scheduler:
    <<: *app
    command: php artisan schedule:work
    environment:
      <<: *app-env
      RUN_MIGRATIONS: "false"
    depends_on:
      app:
        condition: service_healthy

  # ---------- MySQL ----------
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-laravel}
      MYSQL_USER: ${DB_USERNAME:-laravel}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-change-me-root}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  db_data:
  storage_data:
  caddy_data:
  caddy_config:
